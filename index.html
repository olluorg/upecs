          <h2>Что такое PECS</h2>
          <p>PECS (Picture Exchange Communication System, «система коммуникации через обмен изображениями») — методика альтернативной и дополнительной коммуникации, разработанная Эндрю Бонди и Лори Фрост в 1985 году. Ребёнок учится сообщать о своих желаниях, передавая карточку с изображением партнёру по общению. Инициатива и понимание самого коммуникативного акта появляются до появления слов.</p>

          <h2>Кому подходит</h2>
          <ul>
            <li>Дети с расстройством аутистического спектра (РАС)</li>
            <li>Дети с задержкой речевого развития</li>
            <li>Дети с ДЦП, апраксией, генетическими синдромами, влияющими на речь</li>
            <li>Все, кому нужен инструмент для выражения желаний без устной речи</li>
          </ul>

          <h2>Шесть фаз PECS</h2>
          <ul>
            <li><strong>Фаза I — Физический обмен.</strong> Ребёнок учится брать карточку и класть её в руку взрослого.</li>
            <li><strong>Фаза II — Расстояние и настойчивость.</strong> Ребёнок приносит карточку, даже если взрослый отошёл.</li>
            <li><strong>Фаза III — Различение картинок.</strong> Ребёнок выбирает нужную карточку из нескольких.</li>
            <li><strong>Фаза IV — Структура предложения.</strong> Ребёнок собирает фразу «Я хочу ___».</li>
            <li><strong>Фаза V — Ответ на вопрос.</strong> Ребёнок отвечает карточками на «Что ты хочешь?».</li>
            <li><strong>Фаза VI — Комментирование.</strong> Ребёнок сообщает «Я вижу ___», «Я слышу ___».</li>
          </ul>

          <h2>Советы по началу</h2>

            <li><strong>Сколько карточек нужно?</strong> Начинайте с 2–3, постепенно добавляйте новые.</li>

          <h2>What is PECS</h2>
          <p>PECS (Picture Exchange Communication System) is an augmentative and alternative communication (AAC) method developed by Andy Bondy and Lori Frost in 1985. The child learns to communicate desires by handing a picture card to a communication partner. Initiative and understanding of the communicative act develop before words appear.</p>

          <h2>Who it's for</h2>
          <ul>
            <li>Children with autism spectrum disorder (ASD)</li>
            <li>Children with speech or language delays</li>
            <li>Children with cerebral palsy, apraxia, or genetic syndromes affecting speech</li>
            <li>Anyone who needs a tool to express needs without spoken language</li>
          </ul>

          <h2>Six phases of PECS</h2>
          <ul>
            <li><strong>Phase I — Physical exchange.</strong> The child learns to pick up a card and place it in the adult's hand.</li>
            <li><strong>Phase II — Distance and persistence.</strong> The child brings the card even when the adult has moved away.</li>
            <li><strong>Phase III — Picture discrimination.</strong> The child selects the correct card from several options.</li>
            <li><strong>Phase IV — Sentence structure.</strong> The child builds the phrase "I want ___".</li>
            <li><strong>Phase V — Responding to questions.</strong> The child answers "What do you want?" with cards.</li>
            <li><strong>Phase VI — Commenting.</strong> The child learns to say "I see ___", "I hear ___".</li>
          </ul>

          <h2>Getting started</h2>
          <p>Start with 2–3 cards your child really wants. Print them, laminate, and attach velcro to the back. Regularity beats duration: 10 short episodes a day is more effective than one hour-long session.</p>

          <h2>FAQ</h2>
          <ul>
            <li><strong>What age can you start?</strong> Most commonly from 18 months, but PECS is effective at any age.</li>
            <li><strong>Will PECS delay speech?</strong> Research shows the opposite: AAC helps speech emerge.</li>
            <li><strong>How many cards do you need?</strong> Start with 2–3 and gradually add more.</li>
          </ul>
